<header class="site-nav">
  <a class="site-nav__brand" href="{{ '/' | relative_url }}">Aych Labs</a>
  <nav aria-label="Primary">
    <ul>
      {% for app in site.data.apps %}{% if app.status == "live" %}
      <li><a href="{{ '/' | append: app.slug | append: '/privacy-policy/' | relative_url }}">{{ app.name }}</a></li>
      {% endif %}{% endfor %}
      <li><a href="{{ '/legal/terms-of-service/' | relative_url }}">Terms</a></li>
    </ul>
  </nav>
</header>
